name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @projectquote/api exec prisma generate
      - run: pnpm --filter @projectquote/schemas build
      - run: pnpm --filter @projectquote/api exec prisma validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @projectquote/api test

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @projectquote/schemas build
      - run: pnpm --filter @projectquote/web build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test -c e2e/playwright.config.ts e2e/smoke.spec.ts
        env:
          CI: "true"
